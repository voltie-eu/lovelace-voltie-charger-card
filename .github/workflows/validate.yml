name: Validate

on:
  push:
  pull_request:
  schedule:
    # Nightly, so a new HACS rule surfaces before a release.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
